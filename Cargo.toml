[package]
name = "discordfs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
fuser = "0.18.0"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
rustyline = { version = "18.0.0", default-features = false, features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
